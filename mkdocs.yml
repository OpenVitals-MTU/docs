site_name: OpenVitals
site_description: Local-first Android health dashboard powered by Health Connect.
site_url: https://openvitals.health/
repo_url: https://codeberg.org/OpenVitals/website
repo_name: OpenVitals/website

theme:
  name: material
  logo: assets/images/openvitals-logo.png
  favicon: assets/images/openvitals-logo.png
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Support: support.md
  - App:
      - Install: app/install.md
      - Getting Started: app/getting-started.md
      - Feature Inventory: app/features.md
      - Screenshots: app/screenshots.md
      - Health Connect: app/health-connect.md
      - Permissions: app/permissions.md
      - Privacy: app/privacy.md
      - Local And Connected Editions: app/editions.md
      - FAQ: app/faq.md
  - How-to's:
      - Overview: how-to/index.md
      - Add Offline Maps: how-to/offline-maps.md
  - Features:
      - Overview: features/index.md
      - Health Connect Metrics Dashboard: features/health-connect-metrics-dashboard.md
      - Non Health Connect Metrics Dashboard: features/non-health-connect-metrics-dashboard.md
      - Manual Entry Of Metrics: features/manual-entry-metrics.md
      - Recording Of Activity: features/activity-recording.md
      - Offline Maps Support: features/offline-maps-support.md
      - Apple Health Import: features/apple-health-import.md
      - FIT Files Import: features/fit-files-import.md
      - Activity And Training Plans: features/activity-training-plans.md
      - GPX/KML/KMZ/FIT Import: features/route-file-import.md
      - Daily Readiness: features/daily-readiness.md
      - Achievements: features/achievements.md
      - Reminders: features/reminders.md
      - Statistics: features/statistics.md
  - Releases:
      - Changelog: releases/changelog.md
  - Developers:
      - Build From Source: developers/build.md
      - Contributing: developers/contributing.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

plugins:
  - search

extra_css:
  - stylesheets/extra.css
