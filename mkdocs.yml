site_name: OpenVitals
site_description: Local-first Android health dashboard powered by Health Connect.
site_url: https://openvitals.health/
repo_url: https://codeberg.org/OpenVitals/website
repo_name: OpenVitals/website

theme:
  name: material
  logo: assets/images/openvitals-logo.png
  favicon: assets/images/openvitals-logo.png
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Start Here:
      - App Guide: app/index.md
      - Install: app/install.md
      - Getting Started: app/getting-started.md
      - Feature Inventory: app/features.md
      - Screenshots: app/screenshots.md
      - FAQ: app/faq.md
  - Dashboard & App:
      - Feature Overview: features/index.md
      - Health Connect Metrics Dashboard: features/health-connect-metrics-dashboard.md
      - Non Health Connect Metrics Dashboard: features/non-health-connect-metrics-dashboard.md
      - Metric Detail Customization: features/metric-detail-customization.md
      - Home Screen Widgets: features/home-widgets.md
      - Onboarding And Permissions: features/onboarding-and-permissions.md
      - Settings And Preferences: features/settings-and-preferences.md
      - Achievements: features/achievements.md
  - Health Metrics:
      - Activity Metrics: features/activity-metrics.md
      - Sleep Tracking: features/sleep-tracking.md
      - Sleep Score And Recovery: features/sleep-score-and-recovery.md
      - Daily Readiness: features/daily-readiness.md
      - Body Energy: features/body-energy.md
      - Heart And Vitals: features/heart-and-vitals.md
      - Body Metrics: features/body-metrics.md
      - Nutrition: features/nutrition.md
      - Hydration: features/hydration.md
      - Mindfulness: features/mindfulness.md
      - Cycle Tracking: features/cycle-tracking.md
      - Statistics: features/statistics.md
  - Log, Import & Record:
      - Manual Entry Of Metrics: features/manual-entry-metrics.md
      - Beverage Logging And Caffeine: features/beverage-logging-and-caffeine.md
      - Recording Of Activity: features/activity-recording.md
      - Activity And Training Plans: features/activity-training-plans.md
      - Bluetooth LE Sensors: features/ble-sensors.md
      - GPX/KML/KMZ/FIT Import: features/route-file-import.md
      - FIT Files Import: features/fit-files-import.md
      - Offline Maps Support: features/offline-maps-support.md
      - Apple Health Import: features/apple-health-import.md
      - Preloaded Beverage Nutrition Reference: features/preloaded-beverage-nutrition.md
      - Reminders: features/reminders.md
      - How-to Guides: how-to/index.md
      - Add Offline Maps: how-to/offline-maps.md
  - Privacy & Support:
      - Support OpenVitals: support.md
      - Health Connect: app/health-connect.md
      - Permissions: app/permissions.md
      - Privacy: app/privacy.md
      - Privacy, Support, And Diagnostics: features/privacy-support-diagnostics.md
      - Local And Connected Editions: app/editions.md
      - Support Guide: app/support.md
  - Releases:
      - Changelog: releases/changelog.md
  - Developers:
      - Build From Source: developers/build.md
      - Contributing: developers/contributing.md
      - Feature Map: features/feature-map.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

plugins:
  - search

extra_css:
  - stylesheets/extra.css
