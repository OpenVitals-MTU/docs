when:
  - event: pull_request
  - event: push

steps:
  - name: build
    image: node:26-bookworm-slim
    commands:
      - set -eu
      - apt-get update
      - apt-get install -y --no-install-recommends git
      - rm -rf /var/lib/apt/lists/*
      - npm ci
      - npm run build
      - git diff --check

  - name: deploy-fly
    image: flyio/flyctl:latest
    depends_on:
      - build
    environment:
      FLY_API_TOKEN:
        from_secret: FLY_API_TOKEN
    commands:
      - flyctl deploy --remote-only --config fly.toml --app openvitals-docs --yes
    when:
      - event: push
        branch: main
