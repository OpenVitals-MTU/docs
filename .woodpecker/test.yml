when:
  - event: pull_request
  - event: push
    branch: main

steps:
  - name: build
    image: python:3.12-slim
    commands:
      - set -eu
      - apt-get update
      - apt-get install -y --no-install-recommends git
      - rm -rf /var/lib/apt/lists/*
      - python -m pip install --upgrade pip
      - python -m pip install -r requirements.txt
      - mkdocs build --strict
      - printf "openvitals.health\nwww.openvitals.health\n" > site/.domains
      - git diff --check

  - name: deploy-pages
    image: codeberg.org/sugar700/plugin-codeberg-pages-deploy:1
    depends_on:
      - build
    settings:
      folder: site
      branch: pages
      ssh_key:
        from_secret: CODEBERG_PAGES_SSH_KEY
    when:
      - event: push
        branch: main
